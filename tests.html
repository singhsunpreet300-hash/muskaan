<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bolee — tests</title>
<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #14100C; color: #E8DFD2; margin: 0; padding: 24px; line-height: 1.5; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  #summary { padding: 14px 18px; border-radius: 10px; margin: 16px 0; font-weight: 700; }
  .ok   { background: #14432A; color: #9EE6B4; }
  .fail { background: #4A1512; color: #F5A9A0; }
  .group { margin: 18px 0 6px; color: #E0B84B; font-weight: 700; border-bottom: 1px solid #33291F; padding-bottom: 4px; }
  .case { padding: 3px 0 3px 20px; position: relative; font-size: .88rem; }
  .case::before { position: absolute; left: 0; }
  .pass::before { content: '✓'; color: #6BCB77; }
  .fail-case { color: #F5A9A0; }
  .fail-case::before { content: '✗'; color: #F5A9A0; }
  .detail { color: #9A8B7A; font-size: .8rem; padding-left: 20px; white-space: pre-wrap; }
  a { color: #E0B84B; }
</style>
</head>
<body>

<h1>ਬੋਲੀ — test runner</h1>
<p><a href="index.html">← back to the app</a></p>
<div id="summary">running…</div>
<div id="results"></div>

<script src="js/vocabulary.js"></script>
<script src="data/phrases.js"></script>
<script src="data/audio-map.js"></script>
<script src="data/lessons.js"></script>
<script src="js/store.js"></script>
<script src="js/content.js"></script>
<script src="js/ai-tutor.js"></script>
<script src="js/bhashini.js"></script>
<script src="js/speech.js"></script>
<script src="js/practice.js"></script>
<script src="js/contribute.js"></script>
<script src="js/verify.js"></script>
<script src="js/translate.js"></script>

<script>
/* Dependency-free runner. Tests target pure logic only —
   no network, no DOM rendering, no speech APIs. */

var passed = 0, failed = 0;
var out = document.getElementById('results');

function group(name) {
  var el = document.createElement('div');
  el.className = 'group';
  el.textContent = name;
  out.appendChild(el);
}

function check(name, condition, detail) {
  var el = document.createElement('div');
  if (condition) {
    passed++;
    el.className = 'case pass';
    el.textContent = name;
  } else {
    failed++;
    el.className = 'case fail-case';
    el.textContent = name;
  }
  out.appendChild(el);
  if (!condition && detail) {
    var d = document.createElement('div');
    d.className = 'detail';
    d.textContent = detail;
    out.appendChild(d);
  }
}

function eq(name, actual, expected) {
  var same = JSON.stringify(actual) === JSON.stringify(expected);
  check(name, same, same ? '' : 'expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
}

/* ══════════════ data integrity ══════════════ */
group('Vocabulary data');

var V = window.VOCAB;
var CATS = window.VOCAB_CATEGORIES.map(function (c) { return c.id; });
var DIALECTS = window.VOCAB_DIALECTS.map(function (d) { return d.id; });

check('at least 200 seed words (' + V.length + ')', V.length >= 200);
check('all eight categories present', CATS.length === 8);

var counts = {};
V.forEach(function (w) { counts[w.category] = (counts[w.category] || 0) + 1; });
CATS.forEach(function (c) {
  check('category "' + c + '" has ≥25 words (' + (counts[c] || 0) + ')', (counts[c] || 0) >= 25);
});

var ids = {}, dupeId = null;
V.forEach(function (w) { if (ids[w.id]) dupeId = w.id; ids[w.id] = true; });
check('word ids are unique', !dupeId, 'duplicate: ' + dupeId);

var schemaBad = V.filter(function (w) {
  return !w.id || !w.gurmukhi || !w.latin || !w.pos || !w.meaning || !w.category ||
         !w.example || !w.example.gurmukhi || !w.example.latin ||
         !w.emoji || !w.tier || !w.dialect || w.status !== 'verified' || w.source !== 'seed';
});
check('every word matches the schema', schemaBad.length === 0,
      schemaBad.length ? 'first bad: ' + JSON.stringify(schemaBad[0]) : '');

var badCat = V.filter(function (w) { return CATS.indexOf(w.category) === -1; });
check('every category value is known', badCat.length === 0);

var badTier = V.filter(function (w) { return [1, 2, 3].indexOf(w.tier) === -1; });
check('every tier is 1, 2 or 3', badTier.length === 0);

var badDialect = V.filter(function (w) { return DIALECTS.indexOf(w.dialect) === -1; });
check('every dialect value is known', badDialect.length === 0,
      badDialect.length ? 'first bad: ' + badDialect[0].gurmukhi + ' → ' + badDialect[0].dialect : '');

var GURMUKHI = /[਀-੿]/;
var nonGurmukhi = V.filter(function (w) { return !GURMUKHI.test(w.gurmukhi); });
check('every word is written in Gurmukhi', nonGurmukhi.length === 0);

var kidsPool = V.filter(function (w) { return w.tier <= 2; });
check('kids mode has a usable pool (' + kidsPool.length + ' words)', kidsPool.length >= 100);

/* REGRESSION — kids tap-answers render as emoji, so a word needs enough
   same-category companions carrying a DIFFERENT emoji to fill a four-choice
   question. Strict global uniqueness was the old assertion; it is not
   satisfiable once a category grows past the supply of sensible emoji for
   abstract ideas, and it was never what actually mattered. */
function emojiStarved(pool) {
  return pool.filter(function (w) {
    var alternatives = pool.filter(function (o) {
      return o.category === w.category && o.id !== w.id && o.emoji !== w.emoji;
    });
    return alternatives.length < 3;
  });
}

var starvedAll = emojiStarved(V);
check('every word has 3+ same-category words with a different emoji',
      starvedAll.length === 0,
      starvedAll.slice(0, 5).map(function (w) { return w.gurmukhi + ' ' + w.emoji; }).join(', '));

var starvedKids = emojiStarved(V.filter(function (w) { return w.tier <= 2; }));
check('the same holds in the kids pool (tier <= 2)',
      starvedKids.length === 0,
      starvedKids.slice(0, 5).map(function (w) { return w.gurmukhi + ' ' + w.emoji; }).join(', '));

var dupWords = [];
var seenWord = {};
V.forEach(function (w) {
  if (seenWord[w.gurmukhi]) dupWords.push(w.gurmukhi);
  seenWord[w.gurmukhi] = true;
});
check('no duplicate Gurmukhi entries', dupWords.length === 0, dupWords.join(', '));

/* ══════════════ regression: emoji distractors ══════════════ */
group('Emoji distractors (regression)');

// Force a collision the seed data no longer has, and confirm the guard holds.
var clashPool = [
  { id: 'a', category: 'farm', emoji: '🌾', meaning: 'field',  gurmukhi: 'ਖੇਤ',  latin: 'khet' },
  { id: 'b', category: 'farm', emoji: '🌾', meaning: 'wheat',  gurmukhi: 'ਕਣਕ', latin: 'kanak' },
  { id: 'c', category: 'farm', emoji: '🌾', meaning: 'crop',   gurmukhi: 'ਫ਼ਸਲ', latin: 'fasal' },
  { id: 'd', category: 'farm', emoji: '🐄', meaning: 'cow',    gurmukhi: 'ਗਾਂ',  latin: 'gaan' },
  { id: 'e', category: 'farm', emoji: '🐂', meaning: 'ox',     gurmukhi: 'ਬਲਦ', latin: 'balad' },
  { id: 'f', category: 'farm', emoji: '🚜', meaning: 'tractor',gurmukhi: 'ਟਰੈਕਟਰ', latin: 'traictar' }
];
var target = clashPool[0];
var clashFree = true;
for (var r = 0; r < 40; r++) {
  var picks = window.Practice._pickDistractors(target, clashPool, 3, { distinctEmoji: true });
  picks.forEach(function (pick) { if (pick.emoji === target.emoji) clashFree = false; });
  var emojis = {};
  picks.forEach(function (pick) {
    if (emojis[pick.emoji]) clashFree = false;
    emojis[pick.emoji] = true;
  });
}
check('emoji distractors never duplicate the target emoji', clashFree);
check('emoji distractors are distinct from each other', clashFree);
check('non-emoji questions may still use same-emoji distractors',
      window.Practice._pickDistractors(target, clashPool, 3).length === 3);

/* ══════════════ SRS ══════════════ */
group('Spaced repetition (Practice.grade)');

var P = window.Practice;
var T0 = 1700000000000;   // fixed clock — grade() takes `now` for exactly this reason
var DAY = 86400000;

var c1 = P.grade(null, true, T0);
eq('first correct → interval 1 day', c1.interval, 1);
eq('first correct → reps 1', c1.reps, 1);
check('first correct → due tomorrow', new Date(c1.dueAt).getTime() === T0 + DAY);
check('ease rises on correct', c1.ease > P.SRS.START_EASE);

var c2 = P.grade(c1, true, T0);
eq('second correct → interval 3 days', c2.interval, 3);

var c3 = P.grade(c2, true, T0);
check('third correct multiplies by ease (' + c3.interval + ')', c3.interval === Math.round(3 * c2.ease));

var lapsed = P.grade(c3, false, T0);
eq('wrong answer → interval back to 1', lapsed.interval, 1);
eq('wrong answer → reps reset', lapsed.reps, 0);
eq('wrong answer → lapse counted', lapsed.lapses, 1);
check('ease drops on wrong', lapsed.ease < c3.ease);

var floorCard = { reps: 0, lapses: 0, ease: 1.3, interval: 5, dueAt: null };
for (var i = 0; i < 5; i++) floorCard = P.grade(floorCard, false, T0);
check('ease never falls below the floor', floorCard.ease >= P.SRS.MIN_EASE);

/* REGRESSION — uncapped ease compounded into 1904-day intervals, which
   silently deletes a well-known word from the learner's life. */
var runaway = null;
var maxSeen = 0;
for (var k = 0; k < 30; k++) {
  runaway = P.grade(runaway, true, T0);
  maxSeen = Math.max(maxSeen, runaway.interval);
}
check('ease is capped after 30 correct answers (' + runaway.ease + ')',
      runaway.ease <= P.SRS.MAX_EASE);
check('interval is capped at a year (' + maxSeen + ' days)',
      maxSeen <= P.SRS.MAX_INTERVAL);
check('a well-known word still resurfaces within a year',
      new Date(runaway.dueAt).getTime() - T0 <= P.SRS.MAX_INTERVAL * DAY);

check('a never-seen card is due', P.isDue(null, T0));
check('a future card is not due', !P.isDue({ dueAt: new Date(T0 + DAY).toISOString() }, T0));
check('a past-due card is due', P.isDue({ dueAt: new Date(T0 - DAY).toISOString() }, T0));

/* ══════════════ answer checking ══════════════ */
group('Answer checking');

var q = { answer: 'ਚੁੱਲ੍ਹਾ', acceptLatin: 'chulha' };
check('exact Gurmukhi accepted', P.checkAnswer(q, 'ਚੁੱਲ੍ਹਾ').correct);
check('whitespace tolerated', P.checkAnswer(q, '  ਚੁੱਲ੍ਹਾ  ').correct);
check('exact romanisation accepted', P.checkAnswer(q, 'chulha').correct);
check('romanisation case-insensitive', P.checkAnswer(q, 'Chulha').correct);
check('one-letter romanisation slip accepted', P.checkAnswer(q, 'chullha').correct);
check('an unrelated word is rejected', !P.checkAnswer(q, 'ਰੋਟੀ').correct);
check('empty answer is rejected', !P.checkAnswer(q, '').correct);
check('a far-off romanisation is rejected', !P.checkAnswer(q, 'tandoor').correct);

/* REGRESSION — an unconditional edit distance of 1 accepted a different real
   word: "char" for "ghar", and ਚਾਰ chaar exists. The app was confirming a
   wrong answer as correct. */
var shortQ = { answer: 'ਘਰ', acceptLatin: 'ghar' };
check('"char" is NOT accepted for "ghar"', !P.checkAnswer(shortQ, 'char').correct);
check('"ghar" is still accepted for "ghar"', P.checkAnswer(shortQ, 'ghar').correct);
check('a short word demands an exact romanisation',
      !P.checkAnswer({ answer: 'ਦਿਨ', acceptLatin: 'din' }, 'bin').correct);
check('a long word still forgives one slip',
      P.checkAnswer({ answer: 'ਚੁੱਲ੍ਹਾ', acceptLatin: 'chulha' }, 'chullha').correct);
check('a long word with a different first letter is rejected',
      !P.checkAnswer({ answer: 'ਚੁੱਲ੍ਹਾ', acceptLatin: 'chulha' }, 'thulha').correct);

/* ══════════════ blanking ══════════════ */
group('Example blanking');

eq('exact word is blanked',
   P.blankOut('ਬੇਬੇ ਚੁੱਲ੍ਹਾ ਸਾਫ਼ ਕਰਦੀ ਹੈ।', 'ਚੁੱਲ੍ਹਾ'),
   'ਬੇਬੇ ____ ਸਾਫ਼ ਕਰਦੀ ਹੈ।');
check('an inflected form is still blanked',
      P.blankOut('ਬੇਬੇ ਚੁੱਲ੍ਹੇ ਤੇ ਰੋਟੀ ਲਾਹ ਰਹੀ ਹੈ।', 'ਚੁੱਲ੍ਹਾ').indexOf('____') !== -1);

/* ══════════════ transliteration ══════════════ */
group('Transliteration (Contribute.transliterate)');

var C = window.Contribute;
check('produces Latin output for ਘਰ', /^gh?ar/.test(C.transliterate('ਘਰ')),
      'got: ' + C.transliterate('ਘਰ'));
check('handles vowel signs (ਰੋਟੀ)', C.transliterate('ਰੋਟੀ').indexOf('o') !== -1,
      'got: ' + C.transliterate('ਰੋਟੀ'));
check('handles bindi/tippi as n (ਚੰਨ)', C.transliterate('ਚੰਨ').indexOf('n') !== -1,
      'got: ' + C.transliterate('ਚੰਨ'));
check('returns empty for empty input', C.transliterate('') === '');
check('output contains no Gurmukhi', !GURMUKHI.test(C.transliterate('ਚੁੱਲ੍ਹਾ')),
      'got: ' + C.transliterate('ਚੁੱਲ੍ਹਾ'));

/* REGRESSION — the addak doubles the FOLLOWING consonant, but the inherent
   vowel before it was being dropped: ਮੱਝ came out "mjjh" instead of "majjh".
   Every geminated word got a wrong auto-filled romanisation. */
[['ਮੱਝ', 'majjh'], ['ਸੱਥ', 'satth'], ['ਪੁੱਤ', 'putt'],
 ['ਮੱਖਣ', 'makkhan'], ['ਦੁੱਧ', 'duddh'], ['ਕੱਕਰ', 'kakkar']].forEach(function (pair) {
  var got = C.transliterate(pair[0]);
  check('gemination: ' + pair[0] + ' → ' + pair[1], got === pair[1], 'got: ' + got);
});

/* REGRESSION — independent vowels carry their own vowel and must not also
   take the inherent 'a', or ਅੱਜ comes out "aajj". */
[['ਅੱਜ', 'ajj'], ['ਆਟਾ', 'aataa'], ['ਇੱਕ', 'ikk']].forEach(function (pair) {
  var got = C.transliterate(pair[0]);
  check('independent vowel: ' + pair[0] + ' → ' + pair[1], got === pair[1], 'got: ' + got);
});

var leaks = V.filter(function (w) { return GURMUKHI.test(C.transliterate(w.gurmukhi)); });
check('no seed word leaks Gurmukhi through transliteration', leaks.length === 0,
      leaks.slice(0, 3).map(function (w) { return w.gurmukhi; }).join(', '));

/* ══════════════ dedupe normalisation ══════════════ */
group('Duplicate normalisation');

check('diacritics folded — ਚੁੱਲ੍ਹਾ ≡ ਚੁਲਹਾ',
      C.normalise('ਚੁੱਲ੍ਹਾ') === C.normalise('ਚੁਲ੍ਹਾ'),
      C.normalise('ਚੁੱਲ੍ਹਾ') + ' vs ' + C.normalise('ਚੁਲ੍ਹਾ'));
check('genuinely different words stay different',
      C.normalise('ਰੋਟੀ') !== C.normalise('ਚੁੱਲ੍ਹਾ'));
check('whitespace ignored', C.normalise(' ਘਰ ') === C.normalise('ਘਰ'));

/* ══════════════ validation ══════════════ */
group('Submission validation');

check('rejects an empty draft', !C.validate({}).valid);
check('rejects Latin text in the Gurmukhi field',
      !C.validate({ gurmukhi: 'chulha', meaning: 'stove' }).valid);
check('rejects Devanagari in the Gurmukhi field',
      !C.validate({ gurmukhi: 'चूल्हा', meaning: 'stove' }).valid);
check('rejects a missing meaning', !C.validate({ gurmukhi: 'ਚੁੱਲ੍ਹਾ' }).valid);
check('accepts a valid minimal draft',
      C.validate({ gurmukhi: 'ਚੁੱਲ੍ਹਾ', meaning: 'mud stove' }).valid,
      JSON.stringify(C.validate({ gurmukhi: 'ਚੁੱਲ੍ਹਾ', meaning: 'mud stove' }).errors));
check('rejects an unknown category',
      !C.validate({ gurmukhi: 'ਚੁੱਲ੍ਹਾ', meaning: 'stove', category: 'nonsense' }).valid);
check('rejects an unknown part of speech',
      !C.validate({ gurmukhi: 'ਚੁੱਲ੍ਹਾ', meaning: 'stove', pos: 'gerundive' }).valid);

/* ══════════════ vote weighting ══════════════ */
group('Vote weight (Verify.voteWeight)');

var Vf = window.Verify;
eq('a new contributor weighs 1', Vf.voteWeight(0), 1);
eq('reputation 9 still weighs 1', Vf.voteWeight(9), 1);
eq('reputation 10 weighs 2', Vf.voteWeight(10), 2);
eq('reputation 20 weighs 3', Vf.voteWeight(20), 3);
eq('weight is capped at 3', Vf.voteWeight(500), 3);
eq('negative reputation floors at 1', Vf.voteWeight(-50), 1);

/* ══════════════ tally transitions ══════════════ */
group('Vote tally (Verify.tally)');

function votes(spec) {
  return spec.map(function (s, i) {
    return { voterId: 'u' + i, value: s[0], weight: s[1] };
  });
}

eq('no votes → pending', Vf.tally([]).status, 'pending');
eq('one confirm → still pending', Vf.tally(votes([['confirm', 1]])).status, 'pending');
eq('two confirms → still pending', Vf.tally(votes([['confirm', 1], ['confirm', 1]])).status, 'pending');
eq('three confirms → verified',
   Vf.tally(votes([['confirm', 1], ['confirm', 1], ['confirm', 1]])).status, 'verified');
eq('one weight-3 confirm alone reaches quorum',
   Vf.tally(votes([['confirm', 3]])).status, 'verified');
eq('three doubts → disputed',
   Vf.tally(votes([['doubt', 1], ['doubt', 1], ['doubt', 1]])).status, 'disputed');
eq('doubts cancel confirms',
   Vf.tally(votes([['confirm', 1], ['confirm', 1], ['confirm', 1], ['doubt', 1]])).status, 'pending');
eq('disputed wins when both thresholds are met',
   Vf.tally(votes([['confirm', 3], ['confirm', 3], ['doubt', 1], ['doubt', 1], ['doubt', 1]])).status,
   'disputed');
eq('needed counts down from the threshold', Vf.tally(votes([['confirm', 1]])).needed, 2);
eq('needed is zero once verified',
   Vf.tally(votes([['confirm', 3]])).needed, 0);
eq('a vote with no weight counts as 1',
   Vf.tally([{ value: 'confirm' }, { value: 'confirm' }, { value: 'confirm' }]).status, 'verified');

/* ══════════════ store round-trip ══════════════ */
group('Store (async round-trip)');

var Store = window.Store;

Store.init()
  .then(function () {
    check('init resolves and marks ready', Store.isReady());
    return Store.getProfile();
  })
  .then(function (profile) {
    check('a profile exists after init', !!profile && !!profile.id);
    return Store.getSettings();
  })
  .then(function (settings) {
    check('settings default to adult mode', settings.mode === 'adult');
    check('settings include a voice rate', typeof settings.voiceRate === 'number');
    return Store.getWords({ status: 'verified' });
  })
  .then(function (words) {
    check('getWords returns the seed pool (' + words.length + ')', words.length >= 200);
    return Store.getWords({ category: 'farm' });
  })
  .then(function (farm) {
    check('category filter works', farm.length > 0 && farm.every(function (w) { return w.category === 'farm'; }));
    return Store.getWords({ maxTier: 2 });
  })
  .then(function (easy) {
    check('maxTier filter excludes tier 3', easy.every(function (w) { return w.tier <= 2; }));
    return Store.getWords({ status: 'pending' });
  })
  .then(function (pending) {
    check('no seed word is pending', pending.length === 0);
  })

  /* ══════════════ regression: reputation ledger ══════════════ */
  .then(function () {
    group('Reputation ledger (regression)');
    return Store.reset();
  })
  .then(function () { return Store.getProfile(); })
  .then(function (author) {
    var authorId = author.id;

    /* A word is settled by whoever casts the deciding vote, and self-votes are
       rejected — so the old code, which credited "the current profile", could
       never credit the author. The +2 was unreachable. */
    return Contribute.submit({ gurmukhi: 'ਟੋਕਰੀ', meaning: 'woven basket', category: 'home' })
      .then(function (res) {
        var wordId = res.word.id;
        var chain = Promise.resolve();
        [1, 2, 3].forEach(function (n) {
          chain = chain
            .then(function () { return Store.updateProfile({ id: 'reviewer-' + n }); })
            .then(function () { return Verify.vote(wordId, 'confirm'); });
        });
        return chain
          .then(function () { return Store.updateProfile({ id: authorId }); })
          .then(function () { return Store.getWord(wordId); })
          .then(function (word) {
            check('three confirms verify the word', word.status === 'verified', 'got ' + word.status);
            return Store.getLedger(authorId);
          })
          .then(function (entry) {
            check('the AUTHOR earns +2, not the voter', entry.reputation === 2,
                  'author reputation = ' + entry.reputation);
            check('the author\'s verifiedCount increments', entry.verifiedCount === 1);
            check('the author\'s submitted count is tracked', entry.submitted === 1);
            return Store.getLedger('reviewer-1');
          })
          .then(function (rev) {
            check('a voter matching the outcome earns +1', rev.reputation === 1,
                  'reviewer reputation = ' + rev.reputation);
            check('the voter\'s votesCast is tracked', rev.votesCast === 1);
            return Store.getProfile();
          })
          .then(function (me) {
            check('getProfile merges the ledger in', me.reputation === 2 && me.verifiedCount === 1);
            check('vote weight rises with earned reputation', Verify.voteWeight(me.reputation) === 1);
          });
      });
  })

  /* ══════════════ regression: revise a disputed word ══════════════ */
  .then(function () {
    group('Disputed → revise (regression)');
    return Store.reset();
  })
  .then(function () { return Store.getProfile(); })
  .then(function (author) {
    var authorId = author.id;
    return Contribute.submit({ gurmukhi: 'ਟੋਕਰੀ', meaning: 'wrong meaning', category: 'home' })
      .then(function (res) {
        var wordId = res.word.id;
        var chain = Promise.resolve();
        [1, 2, 3].forEach(function (n) {
          chain = chain
            .then(function () { return Store.updateProfile({ id: 'doubter-' + n }); })
            .then(function () { return Verify.vote(wordId, 'doubt', { note: 'wrong' }); });
        });
        return chain
          .then(function () { return Store.updateProfile({ id: authorId }); })
          .then(function () { return Store.getWord(wordId); })
          .then(function (word) {
            check('three doubts dispute the word', word.status === 'disputed');
            return Verify.reviseAndResubmit(wordId, { meaning: 'woven basket' });
          })
          .then(function () { return Store.getWord(wordId); })
          .then(function (word) {
            check('revision returns it to pending', word.status === 'pending');
            check('the correction is applied', word.meaning === 'woven basket');
            return Store.getVotes(wordId);
          })
          .then(function (votes) {
            /* Without clearing them, the old doubts still count and a single
               new vote re-disputes the fix instantly — it could never pass. */
            check('stale doubts are cleared on revision', votes.length === 0,
                  votes.length + ' votes survived');
            return Store.updateProfile({ id: 'fresh-voter' });
          })
          .then(function () { return Verify.vote(wordId, 'confirm'); })
          .then(function (r) {
            check('a revised word is not instantly re-disputed', r.status === 'pending',
                  'got ' + r.status);
            return Store.updateProfile({ id: authorId });
          });
      });
  })

  /* ══════════════ precomputed content ══════════════ */
  .then(function () {
    group('Precomputed content (no key needed)');

    var phrases = window.BOLEE_PHRASES || [];
    var lessons = window.BOLEE_LESSONS || [];

    check('phrasebook has 80+ phrases (' + phrases.length + ')', phrases.length >= 80);
    var badPhrase = phrases.filter(function (p) {
      return !p.gurmukhi || !p.latin || !p.english || !p.group || !GURMUKHI.test(p.gurmukhi);
    });
    check('every phrase is well formed and in Gurmukhi', badPhrase.length === 0,
          badPhrase.slice(0, 3).map(function (p) { return p.english; }).join(', '));

    var groupIds = (window.BOLEE_PHRASE_GROUPS || []).map(function (x) { return x.id; });
    var orphanGroup = phrases.filter(function (p) { return groupIds.indexOf(p.group) === -1; });
    check('every phrase belongs to a known group', orphanGroup.length === 0);

    check('there are 8+ lessons (' + lessons.length + ')', lessons.length >= 8);
    var badLesson = lessons.filter(function (l) {
      return !l.id || !l.title || !l.summary || !l.blocks || !l.blocks.length;
    });
    check('every lesson is well formed', badLesson.length === 0);

    var badBlock = [];
    lessons.forEach(function (l) {
      l.blocks.forEach(function (b) {
        if (b.t === 'pair') {
          if (!b.gurmukhi || !b.english || !GURMUKHI.test(b.gurmukhi)) badBlock.push(l.id);
        } else if (!b.text) badBlock.push(l.id);
      });
    });
    check('every lesson block has its required fields', badBlock.length === 0,
          badBlock.slice(0, 3).join(', '));

    // Explanations load lazily per category — pull them all and verify coverage.
    var cats = window.VOCAB_CATEGORIES.map(function (c) { return c.id; });
    return Promise.all(cats.map(function (c) { return window.Content.preload(c); }))
      .then(function () {
        var E = window.BOLEE_EXPLANATIONS || {};
        var covered = V.filter(function (w) { return !!E[w.gurmukhi]; });
        check('every one of the ' + V.length + ' words has an explanation',
              covered.length === V.length,
              (V.length - covered.length) + ' missing');

        var badExp = V.filter(function (w) {
          var e = E[w.gurmukhi];
          return e && (!e.usage || !e.examples || !e.examples.length ||
                       !e.examples[0].gurmukhi || !e.examples[0].english);
        });
        check('every explanation has usage text and a worked example', badExp.length === 0,
              badExp.slice(0, 3).map(function (w) { return w.gurmukhi; }).join(', '));
      });
  })

  /* ══════════════ shipped audio clips ══════════════ */
  .then(function () {
    group('Shipped pronunciation clips');

    var AUDIO = window.BOLEE_AUDIO || {};
    var keys = Object.keys(AUDIO);
    check('audio map is present (' + keys.length + ' clips)', keys.length > 100);

    var orphan = keys.filter(function (k) {
      return !V.some(function (w) { return w.gurmukhi === k; });
    });
    check('every clip maps to a real word', orphan.length === 0, orphan.slice(0, 5).join(', '));

    var badPath = keys.filter(function (k) { return !/^audio\/[\w.-]+\.mp3$/.test(AUDIO[k]); });
    check('every clip path is well formed', badPath.length === 0, badPath.slice(0, 3).join(', '));

    var dupTarget = {}, collisions = [];
    keys.forEach(function (k) {
      if (dupTarget[AUDIO[k]]) collisions.push(AUDIO[k]);
      dupTarget[AUDIO[k]] = true;
    });
    check('no two words share one clip file', collisions.length === 0, collisions.slice(0, 3).join(', '));

    check('SpeechEngine resolves a covered word',
          !!window.SpeechEngine.shippedClipFor(keys[0]));
    check('SpeechEngine returns null for an uncovered word',
          window.SpeechEngine.shippedClipFor('ਇਹਕੋਈਸ਼ਬਦਨਹੀਂ') === null);
    check('hasShippedClip agrees with shippedClipFor',
          window.SpeechEngine.hasShippedClip(keys[0]) === true &&
          window.SpeechEngine.hasShippedClip('ਇਹਕੋਈਸ਼ਬਦਨਹੀਂ') === false);

    // Every referenced file must actually exist — a broken path is silent.
    return Promise.all(keys.slice(0, 12).map(function (k) {
      return fetch(AUDIO[k], { method: 'HEAD' })
        .then(function (r) { return r.ok; })
        .catch(function () { return false; });
    })).then(function (results) {
      var missing = results.filter(function (r) { return !r; }).length;
      check('sampled clip files all exist on disk', missing === 0, missing + ' of 12 missing');
    });
  })

  /* ══════════════ local translation — zero network ══════════════ */
  .then(function () {
    group('Translation ladder — local rung');

    var T = window.Translate;

    return T.run('house', { localOnly: true }).then(function (r) {
      check('an English word resolves from the dictionary offline',
            r.gurmukhi === 'ਘਰ' && r.source === 'dictionary', JSON.stringify(r));
      return T.run('ਘਰ', { localOnly: true });
    }).then(function (r) {
      check('a Gurmukhi word resolves offline', r.english === 'house, home', JSON.stringify(r));
      return T.run('ghar', { localOnly: true });
    }).then(function (r) {
      check('a romanised word resolves offline', r.gurmukhi === 'ਘਰ');
      return T.run('How are you?', { localOnly: true });
    }).then(function (r) {
      check('a phrasebook entry resolves offline',
            r.source === 'phrasebook' && /ki haal/.test(r.latin), JSON.stringify(r));
      return T.run('ਚੁਲਹਾ', { localOnly: true });
    }).then(function (r) {
      check('diacritic-folded spelling still matches', r.gurmukhi === 'ਚੁੱਲ੍ਹਾ', JSON.stringify(r));
      check('hasLocal reports a known word', T.hasLocal('roti') === true);
      check('hasLocal reports an unknown sentence', T.hasLocal('the quantum aardvark') === false);

      return T.run('the quantum aardvark deliberates', { localOnly: true })
        .then(function () {
          check('an unknown phrase should not resolve locally', false);
        })
        .catch(function (err) {
          check('an unknown phrase rejects with a code, not a crash', err.code === 'not-local');
        });
    });
  })

  /* ══════════════ providers degrade quietly ══════════════ */
  .then(function () {
    group('Provider fallback');

    // No proxy exists on this static test host, so the probe must resolve
    // false rather than reject — an unavailable provider is a normal state.
    return window.AiTutor.probeProxy();
  })
  .then(function (caps) {
    check('proxy probe resolves instead of throwing', typeof caps === 'object');
    check('probe reports chat unavailable with no function host', caps.chat === false);
    return window.Bhashini.isAvailable();
  })
  .then(function (ok) {
    check('Bhashini reports unavailable without a proxy', ok === false);
    return window.Bhashini.synthesise('ਘਰ');
  })
  .then(function (blob) {
    check('Bhashini returns null rather than throwing', blob === null);
    return window.AiTutor.isConfigured();
  })
  .then(function (configured) {
    check('tutor reports unconfigured with no proxy and no key', configured === false);
    return window.AiTutor.provider();
  })
  .then(function (which) {
    check('provider resolves to "none" when nothing is set up', which === 'none');
    // The whole point of the ladder: speech still resolves, never rejects.
    return window.SpeechEngine.speak('ਘਰ', { wordId: null });
  })
  .then(function (spoke) {
    check('speak() resolves even with every provider unavailable',
          spoke === true || spoke === false);
    return window.AiTutor.translate('house').then(function () {
      check('translate without a provider should reject', false);
    }).catch(function (err) {
      check('translate rejects with a coded error, not a crash', !!err.code, 'code: ' + err.code);
    });
  })
  .then(function () { return Store.reset(); })

  .then(function () {
    var el = document.getElementById('summary');
    el.className = failed === 0 ? 'ok' : 'fail';
    el.textContent = failed === 0
      ? '✓ all ' + passed + ' checks passed'
      : '✗ ' + failed + ' failed, ' + passed + ' passed';
  })
  .catch(function (err) {
    var el = document.getElementById('summary');
    el.className = 'fail';
    el.textContent = '✗ runner crashed: ' + err.message;
    console.error(err);
  });
</script>
</body>
</html>
